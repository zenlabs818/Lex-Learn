<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lex Learn</title>

<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

<style>
  body {
    margin: 0;
  }

  #pdfViewer {
    width: 100%;
    height: calc(100vh - 60px);
    border: none;
  }
</style>
</head>

<body>

<!-- Top bar -->
<div class="w3-bar w3-teal w3-top">
  <button class="w3-bar-item w3-button w3-hide-large" onclick="w3_open()">☰</button>
  <span class="w3-bar-item">Lex Learn</span>
</div>

<!-- Sidebar -->
<nav class="w3-sidebar w3-bar-block w3-card w3-animate-left w3-teal"
     style="width:200px; display:none"
     id="mySidebar">

  <button class="w3-bar-item w3-button w3-hide-large" onclick="w3_close()">Close ×</button>
  <a href="../../index.html">Home</a>

  <h3 class="w3-bar-item">GOVERNMENT</h3>
</nav>

<!-- Main content -->
<div class="w3-main" style="margin-left:200px; margin-top:60px">

  <iframe id="pdfViewer"></iframe>

</div>

<script>
  // Sidebar controls
  function w3_open() {
    document.getElementById("mySidebar").style.display = "block";
  }

  function w3_close() {
    document.getElementById("mySidebar").style.display = "none";
  }

  // List of topics and their PDF files
  const topics = [
    { name: "Introducation Importance Of Government", file: "govern/introducation_importance_of_government-1.pdf" },
    { name: "Indigenous Gystems Of Government In Ghana", file: "govern/Indigenous_systems_of_government_in_ghana-2.pdf"},
    { name: "Constitution And Organs Of Government-3", file: "govern/constitution_and_organs_of_government-3.pdf" },
    { name: "Rtate Society Relations", file: "govern/state_society_relations-4.pdf" },
    { name: "Actors In International system", file:"govern/actors_in_international_system-5.pdf"},
    { name: "Government_YEAR-2", file:"govern/Government_YEAR-2.pdf"},
  

    // Add more sections here
  ];
  const sidebar = document.getElementById("mySidebar");
  const pdfViewer = document.getElementById("pdfViewer");

  topics.forEach(topic => {
    const btn = document.createElement("button");
    btn.className = "w3-bar-item w3-button";
    btn.textContent = topic.name;
    btn.onclick = () => {
      pdfViewer.src = topic.file;
      if (window.innerWidth < 992) w3_close();
    };
    sidebar.appendChild(btn);
  });

  // Load first PDF
  pdfViewer.src = topics[0].file;

  // Show sidebar on large screens
  if (window.innerWidth >= 992) {
    document.getElementById("mySidebar").style.display = "block";
  }
</script>

</body>
</html>
